<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100%" height="100%"
     viewBox="0 0 120 120"
     preserveAspectRatio="xMidYMid meet">
  <rect width="120" height="120" fill="#111827"/>
  <g transform="translate(60 60)">
    <circle r="22" fill="none" stroke="#374151" stroke-width="5"/>
    <circle r="22" fill="none" stroke="#f59e0b" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="40 100">
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
  <script type="text/javascript" xlink:href="lift.js"/>
</svg>
